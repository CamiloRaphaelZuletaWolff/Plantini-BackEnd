name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Check only — never `--fix` in CI.
      - name: Lint
        run: npm run lint:check

      - name: Unit tests
        run: npm test -- --ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: test -f dist/main.js
